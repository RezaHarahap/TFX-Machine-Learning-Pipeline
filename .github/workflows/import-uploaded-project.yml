name: Import Uploaded TFX Project

on:
  push:
    branches: [main]
    paths:
      - '.upload_parts/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct uploaded project
        shell: bash
        run: |
          set -euo pipefail
          cat .upload_parts/part-*.txt | base64 -d > /tmp/project.pack.xz
          python - <<'PY'
          import json, lzma, pathlib
          raw = lzma.open('/tmp/project.pack.xz', 'rb').read()
          header_len = int.from_bytes(raw[:8], 'big')
          header = json.loads(raw[8:8+header_len])
          payload = raw[8+header_len:]
          blocks = []
          pos = 0
          for length in header['lengths']:
              blocks.append(payload[pos:pos+length])
              pos += length
          root = pathlib.Path('.')
          for rel, idx in header['files']:
              path = root / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(blocks[idx])
          PY
      - name: Remove temporary upload files and commit project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload_parts
          rm -f .github/workflows/import-uploaded-project.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Initial full upload TFX Machine Learning Pipeline'
          git push origin HEAD:main
